version: '3.8'

services:
  api:
    build: .
    container_name: agent_api
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output

  web:
    build: .
    container_name: agent_web
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
